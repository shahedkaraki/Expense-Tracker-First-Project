<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- navbar -->
  <nav class="navbar bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1 text-light">Expense Tracker</span>
    </div>
  </nav>

  <!-- cards -->

  <div class="container mt-4">

    <div class="summary-cards">

      <!-- totla amount -->
      <div>
        <div class="card h-100">
          <div class="card-body text-center">
            <p class="card-text text-secondary">total amount</p>
            <h3 class="card-title"  id="total-amount">0</h3>
            
          </div>
        </div>
      </div>

      <!-- number of expenses -->

      <div>
        <div class="card h-100">
          <div class="card-body text-center">

            <p class="card-text text-secondary">Number Of Expenses </p>
            <h3 class="card-title" id="number-of-expenses">0</h3>
            
          </div>
        </div>
      </div>

      <!-- highest expense -->

      <div>
        <div class="card h-100">
          <div class="card-body text-center">
            <p class="card-text text-secondary">Highest Expense</p>
            <h3 class="card-title" id="highest-expense" >0</h3>
            <p class="card-text text-secondary" id="highest-category">Category</p>
          </div>
        </div>
      </div>



    </div>

  </div>



  <!-- form  -->

  <div class="container mt-4">
    <div class="card">
      <div class="card-body">
        <div class="card-title mb-3">
          <h4>Add Expense</h4>
          

          <form id="expense-form" novalidate>

            <div class="row g-3">
              <!-- title  -->
               <div class="col-md-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" class="form-control" required>
                <div id="title-message"></div>
               </div>

               <!-- amount -->

               <div class="col-md-3">
                <label for="amount" class="form-label">Amount</label>
                <input type="number" class="form-control" id="amount" required min="0.01" step="0.01" placeholder="00.00">
                <div id="amount-message"></div>
               </div>

               <!-- category -->
                <div class="col-md-3">
                  <label for="category" class="form-label">Category</label>
                  <select class="form-select" id="category" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                  </select>
                  <div id="category-message"></div>
                </div>


                <!-- date -->

                <div class="col-md-3">
                  <label for="date" class="form-label">Date</label>
                  <input type="date" class="form-control" id="date" required>
                  <div id="date-message"></div>
                </div>

            </div>

            <!-- button  -->

            <div class="mt-3">
              <button type="submit" class="btn btn-dark text-light">Add Expense</button>
            </div>

            

          </form>


          

        </div>
      </div>
    </div>

    <div id="alert-container" class="mt-3"></div>
  </div>


<!-- spinner -->

<div id="loading-spinner" class="text-center d-none">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading....</span>
  </div>
</div>


  <!-- table  -->

  <div class="container mt-4">
    <div class="card">
      <div class="card-body">
        <!-- title&filter-->

       <div class="d-flex justify-content-between align-items-center mb-3">

        <h5 class="card-title">Expenses</h5>

        <div class="d-flex align-items-center gap-2">

          <label for="category-filter" class="mb-0">Category</label>
          <select id="category-filter" class="form-select">
            <option value="">All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

       </div>

       <!-- table  -->

       <div class="table-responsive">
        <table class="table table-hover table-striped">

          <thead>
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="table-body">

          </tbody>
        </table>
       </div>

      </div>
    </div>
  </div>


<!-- pop up modal -->
 <!-- for edit button  -->

  <div class="modal fade" id="edit-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Expense</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label for="edit-title" class="form-label">Title</label>
          <input type="text" id="edit-title" class="form-control">
        </div>

        <div class="mb-3">
          <label for="edit-amount" class="form-label">Amount</label>
          <input type="number" id="edit-amount" class="form-control" min="0.01" step="0.01">
        </div>


        <div class="mb-3">
          <label for="edit-category" class="form-label">Category</label>
          <select id="edit-category" class="form-select">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>

          </select>
        </div>

        <div class="mb-3">
          <label for="edit-date" class="form-label">Date</label>
          <input type="date" id="edit-date" class="form-control">
        </div>

      </div>


      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-dark" id="save-edit-btn">Save changes</button>
      </div>
    </div>
  </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
